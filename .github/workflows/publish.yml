name: publish

# Publishes when the version in package.json is not on npm yet.
# Then creates a GitHub release and a <version> tag when they do not exist yet.
# The ci workflow fails pull requests that do not bump the version.
on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  publish:
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v4

  release:
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(jq -r .version package.json)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
